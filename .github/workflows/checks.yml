name: VeriBrand checks
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install document test dependencies
        run: python -m pip install pypdf python-docx
      - name: Compile Python
        run: python -m compileall -q .
      - name: Validate JSON configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("brand_rules.json", "knowledge_base.json"):
              json.loads(Path(name).read_text(encoding="utf-8"))
              print(f"{name}: valid")
          PY
      - name: Run claim-engine regression tests
        run: python -m unittest discover -s tests -v
      - name: Check required demo files
        run: |
          test -f app.py
          test -f requirements.txt
          test -f sample_uploads/test_post.txt
          test -f sample_uploads/test_ad.pdf
          test -f sample_uploads/test_email.docx
